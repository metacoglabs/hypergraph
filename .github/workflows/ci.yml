name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test
        run: ./mvnw -B -ntp install
      - name: Check Studio modules
        run: for f in $(find server/src/main/resources/studio/js -name '*.js'); do node --check "$f"; done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  native:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Native image
        run: |
          ./mvnw -B -ntp -DskipTests install
          ./mvnw -B -ntp -Pnative -DskipTests package -pl server
      - name: Smoke test
        run: |
          data="$RUNNER_TEMP/hstore"
          server/target/hstore init "$data" --superuser admin --password ci
          server/target/hstore exec "$data" examples/clinical-claims.hql > /dev/null
          server/target/hstore check "$data"

  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hstore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and wait for health
        run: |
          docker run -d --name hstore -e HSTORE_PASSWORD=ci -p 7432:7432 -p 7480:7480 hstore:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hstore)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' hstore | grep -q healthy
          curl -fsS http://127.0.0.1:7480/api/info
          docker stop hstore
          docker logs hstore 2>&1 | grep -q 'shut down cleanly'
